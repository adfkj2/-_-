<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>U01 中心登录页</title>
  <link rel="stylesheet" href="_shared.css">
  <style>
    .auth-card { width: 420px; }
    .login-foot {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 10px 0 12px; text-align: center;
      font-size: 11.5px; color: var(--ink-4);
      border-top: 1px solid var(--line); background: #fff;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="mark">SC</div>
        <div class="name">统一身份认证中心<span>单点登录 · 教务信息服务 A / B</span></div>
      </div>

      <h1 class="auth-title">登录</h1>
      <p class="auth-sub">请使用中心账号登录，登录后可免密进入已授权应用。</p>

      <div class="alert alert-err">
        <span class="ico">!</span>
        <div>账号或密码错误。为避免泄露账号状态，本页不对失败原因作区分。</div>
      </div>

      <div class="field">
        <label for="username">用户名<span class="req">*</span></label>
        <input type="text" id="username" value="alice01">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" value="StudyPass2026!">
      </div>

      <div class="row mb16">
        <div class="checkline"><span class="box"></span>记住本设备（7 天）</div>
        <a href="#" class="right f12h" style="color: var(--brand); text-decoration: none;">忘记密码</a>
      </div>

      <button class="btn btn-primary btn-block" type="button">登录</button>

      <div class="auth-foot">
        <span>还没有账号？</span>
        <a href="#">申请注册</a>
        <span class="spacer"></span>
        <a href="#">登录遇到问题</a>
      </div>
    </div>
  </div>
  <div class="login-foot">统一认证服务 v1.0 · 仅支持 HTTPS 访问 · 连续 5 次失败后账号临时锁定 15 分钟</div>
</body>
</html>
