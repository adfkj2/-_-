<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>U02 注册页</title>
  <link rel="stylesheet" href="_shared.css">
  <style>
    .auth-card { width: 520px; padding: 22px 28px 18px; }
    .auth-brand { margin-bottom: 14px; }
    .field { margin-bottom: 11px; }
    .field input { height: 36px; }
    .auth-title { font-size: 19px; }
    .auth-sub { margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="mark">SC</div>
        <div class="name">统一身份认证中心<span>账号注册 · 提交后需管理员审核</span></div>
      </div>

      <h1 class="auth-title">注册账号</h1>
      <p class="auth-sub">注册信息提交后进入待审核状态，审核通过前不可登录任何接入应用。</p>

      <div class="alert alert-info">
        <span class="ico">i</span>
        <div>账号需与教务系统在册身份一致，管理员审核时核对显示名与邮箱。</div>
      </div>

      <div class="field">
        <label for="ru">用户名<span class="req">*</span></label>
        <input type="text" id="ru" value="bob02">
        <div class="help">4–20 位字母、数字或下划线，注册后不可修改。</div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="rn">显示名<span class="req">*</span></label>
          <input type="text" id="rn" value="王博">
        </div>
        <div class="field">
          <label for="re">邮箱<span class="req">*</span></label>
          <input type="email" id="re" value="bob02@scu.edu.cn">
        </div>
      </div>

      <div class="field">
        <label for="rp">密码<span class="req">*</span></label>
        <input type="password" id="rp" class="invalid" value="12345678">
        <div class="err-text">密码至少 10 位，且同时包含字母与数字；不接受连续 4 位相同字符。</div>
      </div>

      <div class="field">
        <label for="rp2">确认密码<span class="req">*</span></label>
        <input type="password" id="rp2" class="invalid" value="12345678">
        <div class="err-text">两次输入不一致。</div>
      </div>

      <div class="checkline" style="margin: 2px 0 12px;">
        <span class="box"></span>我已阅读并同意《统一认证账号使用规范》
      </div>

      <button class="btn btn-primary btn-block" type="button">提交注册申请</button>

      <div class="auth-foot">
        <span>已有账号？</span><a href="#">返回登录</a>
        <span class="spacer"></span>
        <span class="f12 c4">提交后可凭用户名查询审核进度</span>
      </div>
    </div>
  </div>
</body>
</html>
