<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>统一认证登录</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; }
    main { max-width: 360px; margin: 96px auto; background: #fff; padding: 28px 32px; border-radius: 8px;
           box-shadow: 0 2px 12px rgba(0, 0, 0, .08); }
    h1 { font-size: 20px; margin: 0 0 20px; }
    label { display: block; margin-bottom: 14px; font-size: 14px; color: #333; }
    input { width: 100%; padding: 9px 10px; margin-top: 6px; border: 1px solid #ccd0d5;
            border-radius: 4px; font-size: 14px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 4px; background: #1d5fd0;
             color: #fff; font-size: 15px; cursor: pointer; }
    .tip { font-size: 13px; margin: 0 0 14px; }
    .error { color: #b3261e; }
    .info { color: #1d5fd0; }
  </style>
</head>
<body>
<main>
  <h1>统一认证登录</h1>
  <p class="tip error" th:if="${param.error}">账号或密码错误</p>
  <p class="tip info" th:if="${param.logout}">已退出登录</p>
  <p class="tip info" th:if="${param.expired}">登录已失效，请重新登录</p>
  <form method="post" th:action="@{/login}">
    <label>用户名
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>密码
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">登录</button>
  </form>
</main>
</body>
</html>
