<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${appName}">教务信息服务 A</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; }
    main { max-width: 720px; margin: 56px auto; background: #fff; padding: 28px 32px; border-radius: 8px;
           box-shadow: 0 2px 12px rgba(0, 0, 0, .08); }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { color: #444; font-size: 14px; }
    code { background: #f1f3f5; padding: 2px 5px; border-radius: 3px; }
    form { margin-top: 18px; }
    button { padding: 7px 14px; border: 0; border-radius: 4px; background: #6b7280; color: #fff;
             font-size: 13px; cursor: pointer; }
    .ok { display: inline-block; background: #d1fae5; color: #065f46; padding: 3px 10px;
          border-radius: 12px; font-size: 12px; margin-bottom: 14px; }
  </style>
</head>
<body>
<main>
  <h1 th:text="${appName}">教务信息服务 A</h1>
  <div class="ok" th:if="${authMode == 'SSO'}">已通过统一认证</div>
  <p>当前用户：<strong th:text="${username}">alice01</strong></p>
  <p>身份标识（sub）：<code th:text="${subject}">subject</code></p>
  <p>受保护接口：<code>/api/app/courses</code>、<code>/api/app/me</code>　未登录或授权已撤销时返回 401。</p>
  <form method="post" th:action="@{/logout}">
    <button type="submit">退出本应用</button>
  </form>
</main>
</body>
</html>
