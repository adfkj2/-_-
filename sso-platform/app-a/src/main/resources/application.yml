server:
  port: 8081
  servlet:
    session:
      cookie:
        name: SESSION_A
        http-only: true
        same-site: lax
      timeout: 8h

sso:
  # 认证中心基地址：端口与需求 1.6、设计 2.3 一致
  center-base-url: http://127.0.0.1:8080
  app-id: app-a
  app-secret: ${SSO_APP_A_SECRET:app-a-secret}
  demo:
    # 本地演示账号：只存在进程内存，与中心账号体系无关（设计 4.6）
    accounts:
      locala: "${APP_A_LOCAL_PASSWORD:LocalPass2026!}"
  introspection:
    # 每次受保护请求都调用一次，不做正向缓存（设计 4.1、8.1）
    uri: ${sso.center-base-url}/oauth2/introspect
    connect-timeout-ms: 2000
    read-timeout-ms: 2000

spring:
  application:
    name: app-a
  security:
    oauth2:
      client:
        registration:
          sso:
            client-id: ${sso.app-id}
            client-secret: ${sso.app-secret}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile
            client-name: 统一认证中心
        provider:
          sso:
            authorization-uri: ${sso.center-base-url}/oauth2/authorize
            token-uri: ${sso.center-base-url}/oauth2/token
            jwk-set-uri: ${sso.center-base-url}/oauth2/jwks
            user-name-attribute: sub


