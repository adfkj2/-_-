<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'本地演示页 - ' + ${appName}">本地演示页 - 图书信息服务 B</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; }
    main { max-width: 720px; margin: 56px auto; background: #fff; padding: 28px 32px; border-radius: 8px;
           box-shadow: 0 2px 12px rgba(0, 0, 0, .08); }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { color: #444; font-size: 14px; }
    code { background: #f1f3f5; padding: 2px 5px; border-radius: 3px; }
    .badge { display: inline-block; background: #fef3c7; color: #92400e; border: 1px solid #fcd34d;
             padding: 3px 10px; border-radius: 12px; font-size: 12px; margin-bottom: 14px; }
    .ok { display: inline-block; background: #d1fae5; color: #065f46; padding: 3px 10px;
          border-radius: 12px; font-size: 12px; margin-bottom: 14px; }
    a.btn { display: inline-block; margin-top: 16px; padding: 8px 14px; background: #1d4ed8; color: #fff;
            border-radius: 4px; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1 th:text="${appName}">图书信息服务 B</h1>
  <div class="badge" th:if="${authMode == 'LOCAL'}">未通过统一认证</div>
  <div class="ok" th:if="${authMode == 'SSO'}">已通过统一认证</div>
  <p>当前用户：<strong th:text="${username}">localb</strong></p>
  <p>登录来源（authMode）：<code th:text="${authMode}">LOCAL</code></p>
  <p>这里只展示本地演示数据，未经过认证中心，不能作为单点登录的证据。</p>
  <p>受保护资源 <code>/home</code> 与 <code>/api/app/*</code> 必须使用统一认证登录。</p>
  <a class="btn" th:href="@{/login}">返回登录页</a>
</main>
</body>
</html>
